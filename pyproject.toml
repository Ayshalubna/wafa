[project]
name = "wafa"
version = "1.0.0"
description = "Wafa - telecom churn prediction with SHAP reasons and a retention campaign planner"
requires-python = ">=3.10"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B008", "B905"]
